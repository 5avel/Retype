[package]
name = "retype"
description = "Fix text typed in the wrong keyboard layout. Offline, no telemetry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retype-core.workspace = true
log.workspace = true

# Keep the feature list sorted and minimal. Networking features are forbidden
# (see .claude/rules/security.md and tests/policy.rs).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
