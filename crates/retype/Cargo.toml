[package]
name = "retype"
description = "Fix text typed in the wrong keyboard layout. Offline, no telemetry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retype-core.workspace = true
log.workspace = true

# Keep the feature list sorted and minimal. Networking features are forbidden
# (see .claude/rules/security.md and tests/policy.rs).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
]

[lints]
workspace = true
