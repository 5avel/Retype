name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p retype
      - name: SHA-256
        shell: pwsh
        run: |
          (Get-FileHash target/release/retype.exe -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii target/release/retype.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: retype-windows-x64
          path: |
            target/release/retype.exe
            target/release/retype.exe.sha256

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
