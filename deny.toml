# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Keep the allow list ready for approved deps (serde, toml, anyhow).
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own (unpublished) crates are fine.
allow-wildcard-paths = true
# retype must never be able to talk to the network (SPEC P1, ADR-001).
deny = [
    { crate = "reqwest", reason = "networking is forbidden (ADR-001)" },
    { crate = "ureq", reason = "networking is forbidden (ADR-001)" },
    { crate = "hyper", reason = "networking is forbidden (ADR-001)" },
    { crate = "h2", reason = "networking is forbidden (ADR-001)" },
    { crate = "curl", reason = "networking is forbidden (ADR-001)" },
    { crate = "isahc", reason = "networking is forbidden (ADR-001)" },
    { crate = "attohttpc", reason = "networking is forbidden (ADR-001)" },
    { crate = "tungstenite", reason = "networking is forbidden (ADR-001)" },
    { crate = "rustls", reason = "TLS implies networking (ADR-001)" },
    { crate = "native-tls", reason = "TLS implies networking (ADR-001)" },
    { crate = "openssl", reason = "TLS implies networking (ADR-001)" },
    { crate = "tokio", reason = "no async runtime needed; usually pulls networking" },
    { crate = "self_update", reason = "auto-update is forbidden (SPEC P5)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
