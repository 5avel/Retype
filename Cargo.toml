[workspace]
resolver = "3"
members = ["crates/retype-core", "crates/retype"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
retype-core = { path = "crates/retype-core" }
log = "0.4"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_imports = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
option_option = "deny"
clone_on_copy = "deny"
needless_return = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
